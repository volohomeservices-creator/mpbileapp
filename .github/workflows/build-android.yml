name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
  push:
    branches: [main]

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase patches
        run: node scripts/patch-firebase.js

      - name: Setup Expo
        run: npx expo whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO }}

      - name: Build Android AAB
        run: |
          mkdir -p ./build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'production' }} \
            --local \
            --output ./build/volo-mobile.aab \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: volo-android-aab-${{ github.run_number }}
          path: build/volo-mobile.aab
          retention-days: 90

      - name: Build Summary
        run: |
          echo "## ✅ Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Profile | ${{ github.event.inputs.profile || 'production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the AAB from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
